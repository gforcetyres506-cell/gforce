name: Public production health
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: public-production-health
  cancel-in-progress: false
jobs:
  public-health:
    # Activate only after accepted production and a tested incident owner.
    # Default-branch schedules remain inactive until this explicit opt-in.
    if: vars.GFORCE_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-10-12
        with:
          node-version: '22'
      - run: node scripts/ship-readonly-health.mjs
